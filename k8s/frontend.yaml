apiVersion: apps/v1
kind: Deployment
metadata:
  name: workly-frontend
  labels:
    app: workly-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: workly-frontend
  template:
    metadata:
      labels:
        app: workly-frontend
    spec:
      containers:
        - name: workly-frontend
          image: workly-frontend:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: workly-frontend
  labels:
    app: workly-frontend
spec:
  type: NodePort
  selector:
    app: workly-frontend
  ports:
    - port: 80
      targetPort: 80
