# Sem volume persistente: os dados somem quando o pod é recriado. Aceitável para a demonstração;
# depois de um reinício, rode o seed novamente. Sem autenticação: o Service é apenas interno (ClusterIP).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongo
  labels:
    app: mongo
spec:
  # Não escale: cada réplica teria o próprio banco, sem replica set entre elas.
  replicas: 1
  selector:
    matchLabels:
      app: mongo
  template:
    metadata:
      labels:
        app: mongo
    spec:
      containers:
        - name: mongo
          image: mongo:7
          ports:
            - containerPort: 27017
---
apiVersion: v1
kind: Service
metadata:
  name: mongo
  labels:
    app: mongo
spec:
  type: ClusterIP
  selector:
    app: mongo
  ports:
    - port: 27017
      targetPort: 27017
