server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /react-assets/ { try_files $uri =404; }
    location /assets/ { try_files $uri =404; }
    location /vendor/ { try_files $uri =404; }
    location / { try_files $uri /index.html; }
}
