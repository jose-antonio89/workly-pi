<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workly - Login</title>
    <link rel="stylesheet" href="../assets/css/login.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="../assets/css/theme-global.css">
</head>
<body class="login-page">
    <div class="login-container">
        <div class="login-header">
            <span class="logo"><img class="imagem-logo workly-logo-switch" src="../assets/img/logo.png" data-logo-light="../assets/img/logo.png" data-logo-dark="../assets/img/logo-dark.png" alt="Workly"></span>
            <h1>Bem-vindo ao Workly</h1>
            <p>Faça login para continuar</p>
        </div>
        
        <form id="formLogin" class="login-form">
            <div class="form-group">
                <label for="email">Email*</label>
                <input type="text" id="email" name="email" placeholder="Digite seu email" required>
                <i class="fas fa-user icon"></i>
            </div>
            
            <div class="form-group">
                <label for="senha">Senha*</label>
                <input type="password" id="senha" name="senha" placeholder="Digite sua senha" required minlength="8">
                <button type="button" class="password-toggle" data-password-target="senha" aria-label="Mostrar senha">
                    <i class="fas fa-eye"></i>
                </button>
            </div>
            
            <div class="forgot-password">
                <a href="#">Esqueceu a senha?</a>
            </div>
            
            <button type="submit" class="submit-button">Entrar</button>
            
            <div class="register-link">
                Não tem uma conta? <a href="cadastro.html">Cadastre-se</a>
            </div>
            
            <div class="social-login">
                <p>Ou entre com</p>
                <div class="social-icons">
                    <a href="#" class="social-icon google"><i class="fab fa-google"></i></a>
                    <a href="#" class="social-icon facebook"><i class="fab fa-facebook-f"></i></a>
                    <a href="#" class="social-icon apple"><i class="fab fa-apple"></i></a>
                </div>
            </div>
        </form>
    </div>

     <!-- Modal Esqueceu Senha (aparece ao clicar em "esqueceu a senha")-->
<div class="forgot-password-modal" id="forgotPasswordModal">
    <div class="modal-content">
        <h2>Esqueceu sua senha?</h2>
        <p>Digite seu e-mail para receber instruções para redefinir sua senha</p>
        
        <form class="forgot-password-form">
            <div class="form-group">
                <label for="recovery-email">E-mail</label>
                <input type="email" id="recovery-email" name="recovery-email" placeholder="Digite seu e-mail" required>
            </div>
            
            <button type="submit" class="submit-button">Enviar instruções</button>
        </form>
    </div>
</div>
    <script src="../assets/js/config.js"></script>

    <script src="../assets/js/login.js"></script>
</body>
</html>
